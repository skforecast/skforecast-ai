site_name: skforecast-AI Docs
repo_url: https://github.com/skforecast/skforecast-ai
site_url: https://ai.skforecast.org
site_description: "Python time series forecasting assistant built on skforecast: deterministic decisions, the script that ran, and an optional LLM that explains them."
site_author: Joaquin Amat Rodrigo and Javier Escobar Ortiz
use_directory_urls: false

# The theme overrides (custom_dir) live inside docs_dir, so without this MkDocs
# would also publish the raw templates and the data of the home page.
exclude_docs: |
  /overrides/

# Pages kept only to redirect old links (template: redirect.html).
not_in_nav: |
  /quick-start/quick-start.md

# Report broken links and missing anchors as warnings (the default is INFO,
# which hides them in the build output).
validation:
  links:
    unrecognized_links: warn
    anchors: warn

copyright: Copyright &copy; 2026-present Joaquín Amat Rodrigo and Javier Escobar Ortiz

nav:
  - Home: 
    - Welcome to skforecast-ai: README.md
  
  - Quick start:
    - Installation: quick-start/how-to-install.md
    - Your first forecast: quick-start/first-forecast.ipynb
    - Ask the assistant: quick-start/ask-the-assistant.md

  - User Guides:
    - Agentic forecasting: user-guides/agentic-forecasting.ipynb
    - Agentic forecasting step by step: user-guides/agentic-forecasting-step-by-step.ipynb
    - Configuring the LLM: user-guides/llm-configuration.md
    - Skills for the LLM: user-guides/skills.md
    - Using the CLI: user-guides/cli-usage.md

  - API Reference:
    - Assistant: api/assistant.md
    - Schemas:
      - Results: api/schemas/results.md
      - Plans: api/schemas/plans.md
      - Profiles: api/schemas/profiles.md
    - Exceptions and warnings: api/exceptions.md
    - CLI: api/cli.md
    - MCP server: api/mcp.md

  - Releases:
    - Changelog: releases/releases.md

  - More: 
    - About skforecast-ai: more/about-skforecast-ai.md
    - Consulting and professional services: more/consulting.md

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/version-switcher.js
  # Before home.js, which uses its syntax highlighter.
  - javascripts/ask-window.js
  - javascripts/home.js

hooks:
  - tools/docs/hooks/autorefs_cli_filter.py

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_section_style: table
            filters: ["!^_"] # exclude private members and dunders (^ anchors to start)
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_source: true
            show_if_no_docstring: true
            show_root_full_path: true
            show_root_heading: true
            show_signature_annotations: false
            show_symbol_type_heading: false
            summary: true
            group_by_category: true
            show_category_heading: true
  - mkdocs-typer2:
      pretty: true
      engine: native
  - mkdocs-jupyter:
      allow_errors: False
      execute: False
      ignore_h1_titles: True
      # require.js is needed by the Jupyter widget manager: the notebooks of the
      # user guides are saved with widget outputs.
      include_requirejs: True
      include_source: True
  - mike:
      alias_type: copy
      canonical_version: stable
  - search:
      lang: en
      # Splits words at spaces, punctuation and underscores, at case changes
      # (ForecastingAssistant -> Forecasting, Assistant) and at dots except in
      # version strings (0.3.1 stays whole). Same as the skforecast docs, based
      # on Material's recommendation.
      separator: '[\s\-_,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  # Serves Google Fonts, scripts and images of third parties from the site
  # itself, so no page connects to them before cookie consent (GDPR). The
  # excluded hosts are loaded as usual: Plotly and MathJax of the notebooks
  # and live badges. Downloads are cached in .cache/ (git ignored).
  - privacy:
      # SKFORECAST_AI_DOCS_PRIVACY=false builds without it, for checks in
      # environments whose network policy blocks those hosts (cloud sessions).
      enabled: !ENV [SKFORECAST_AI_DOCS_PRIVACY, true]
      assets_exclude:
        - cdn.plot.ly/*
        - cdnjs.cloudflare.com/ajax/libs/mathjax/*
        - img.shields.io/*
        - zenodo.org/badge/*

theme:
  name: material
  custom_dir: docs/overrides
  favicon: img/favicon.png
  features:
    - announce.dismiss
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - toc.integrate
    - navigation.breadcrumbs
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tooltips
    - search.suggest
    - search.highlight
    - search.share
  font:
    text: Open Sans
    code: Ubuntu Mono
  logo: img/logo-skforecast.png
  palette:
    # primary and accent are "custom": the brand colors are defined in
    # stylesheets/extra.css. Without it, Material applies "indigo", whose rules
    # are more specific and override some of them (links in dark mode).
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      use_pygments: true
      linenums: false
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      # Reusable HTML components shared by the Markdown pages and the theme
      # templates (for example, the team cards: --8<-- "team.html")
      base_path: [docs/overrides/partials]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  
extra:
  version:
    provider: mike
    default: stable
  analytics:
    provider: google
    property: G-1L7X239QEB
  consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/skforecast/
    - icon: fontawesome/brands/github
      link: https://github.com/skforecast/skforecast-ai
    - icon: fontawesome/brands/discord
      link: https://discord.gg/3V52qpNkuj
