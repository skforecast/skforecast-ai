<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 806" width="1040" height="806" role="img" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" color="#9198a1">
  <title>How skforecast-ai works: the fast path runs profiling and planning inside forecast() or backtest(); the step-by-step path calls profile(), plan() and create_cv() so you can inspect each object. compare() ranks several configurations under the same cross-validation, and ask() explains any object at any moment.</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
  <rect x="20" y="20" width="490" height="466" rx="12" fill="#161b22" stroke="#30363d"/>
  <path d="M32,20 h466 a12,12 0 0 1 12,12 v28 h-490 v-28 a12,12 0 0 1 12,-12 z" fill="#1f6feb"/>
  <text x="36" y="45.0" text-anchor="start" fill="#ffffff" font-size="15" font-weight="700">Fast path: one call</text>
  <text x="36" y="80" text-anchor="start" fill="#e6edf3" font-size="12.5" font-weight="400">Data in, result and code out.</text>
  <g transform="translate(0,-16)">
  <rect x="36" y="108" width="458" height="30" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="265.0" y="128" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="600">data</text>
  <path d="M265.0,141 V153" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="36.0" y="156" width="458" height="92" rx="8" fill="#161b22" stroke="#9198a1" stroke-dasharray="5 4"/>
  <text x="265.0" y="199.0" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="700">profile() and plan()</text>
  <text x="265.0" y="215.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">run inside each call below</text>
  <path d="M265.0,251 V263" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="36" y="266" width="221.0" height="220" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="146.5" y="288" text-anchor="middle" fill="#9198a1" font-size="11" font-weight="400" letter-spacing="0.5">FORECAST</text>
  <rect x="273.0" y="266" width="221.0" height="220" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="383.5" y="288" text-anchor="middle" fill="#9198a1" font-size="11" font-weight="400" letter-spacing="0.5">BACKTESTING (VALIDATION)</text>
  <rect x="48.0" y="386" width="197.0" height="50" rx="8" fill="#0c2d6b" stroke="#1f6feb"/>
  <text x="146.5" y="408.0" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="700">forecast()</text>
  <text x="146.5" y="424.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">or forecast_code()</text>
  <path d="M146.5,439 V455" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="146.5" y="474" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="400">predictions + code</text>
  <rect x="285.0" y="300" width="197.0" height="64" rx="8" fill="#0c2d6b" stroke="#1f6feb"/>
  <text x="383.5" y="321.0" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="700">TimeSeriesFold</text>
  <text x="383.5" y="337.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">your own, from skforecast</text>
  <text x="383.5" y="353.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">passed as backtest(data, cv)</text>
  <path d="M383.5,367 V383" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="285.0" y="386" width="197.0" height="50" rx="8" fill="#0c2d6b" stroke="#1f6feb"/>
  <text x="383.5" y="408.0" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="700">backtest()</text>
  <text x="383.5" y="424.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">or backtest_code()</text>
  <path d="M383.5,439 V455" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="383.5" y="474" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="400">metrics + predictions + code</text>
  </g>
  <rect x="530" y="20" width="490" height="466" rx="12" fill="#161b22" stroke="#30363d"/>
  <path d="M542,20 h466 a12,12 0 0 1 12,12 v28 h-490 v-28 a12,12 0 0 1 12,-12 z" fill="#238636"/>
  <text x="546" y="45.0" text-anchor="start" fill="#ffffff" font-size="15" font-weight="700">Step-by-step path: full control</text>
  <text x="546" y="80" text-anchor="start" fill="#e6edf3" font-size="12.5" font-weight="400">Inspect or change each object before running.</text>
  <g transform="translate(0,-16)">
  <rect x="546" y="108" width="458" height="30" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="775.0" y="128" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="600">data</text>
  <path d="M775.0,141 V153" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="546.0" y="156" width="458" height="30" rx="8" fill="#0f3d1f" stroke="#238636"/>
  <text x="775.0" y="176.0" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="700">profile()</text>
  <path d="M775.0,189 V201" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="546.0" y="204" width="458" height="44" rx="8" fill="#0f3d1f" stroke="#238636"/>
  <text x="775.0" y="223.0" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="700">plan()</text>
  <text x="775.0" y="239.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">then refine_plan(), optional, with or without a prompt</text>
  <path d="M775.0,251 V263" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="546" y="266" width="221.0" height="220" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="656.5" y="288" text-anchor="middle" fill="#9198a1" font-size="11" font-weight="400" letter-spacing="0.5">FORECAST</text>
  <rect x="783.0" y="266" width="221.0" height="220" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="893.5" y="288" text-anchor="middle" fill="#9198a1" font-size="11" font-weight="400" letter-spacing="0.5">BACKTESTING (VALIDATION)</text>
  <rect x="558.0" y="386" width="197.0" height="50" rx="8" fill="#0f3d1f" stroke="#238636"/>
  <text x="656.5" y="408.0" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="700">forecast()</text>
  <text x="656.5" y="424.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">or forecast_code()</text>
  <path d="M656.5,439 V455" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="656.5" y="474" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="400">predictions + code</text>
  <rect x="795.0" y="300" width="197.0" height="64" rx="8" fill="#0f3d1f" stroke="#238636"/>
  <text x="893.5" y="321.0" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="700">create_cv()</text>
  <text x="893.5" y="337.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">with or without a prompt</text>
  <text x="893.5" y="353.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">or your own TimeSeriesFold</text>
  <path d="M893.5,367 V383" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="795.0" y="386" width="197.0" height="50" rx="8" fill="#0f3d1f" stroke="#238636"/>
  <text x="893.5" y="408.0" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="700">backtest()</text>
  <text x="893.5" y="424.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">or backtest_code()</text>
  <path d="M893.5,439 V455" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="893.5" y="474" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="400">metrics + predictions + code</text>
  </g>
  <rect x="20" y="506" width="1000" height="160" rx="12" fill="#221610" stroke="#bd561d"/>
  <path d="M32,506 h976 a12,12 0 0 1 12,12 v28 h-1000 v-28 a12,12 0 0 1 12,-12 z" fill="#bd561d"/>
  <text x="36" y="531.0" text-anchor="start" fill="#ffffff" font-size="15" font-weight="700">Model selection: which forecaster should you use?</text>
  <rect x="36" y="562" width="280" height="64" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="176.0" y="581.0" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="700">Candidates</text>
  <text x="176.0" y="599.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">forecasters, estimators, lags or window</text>
  <text x="176.0" y="614.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">features; yours or proposed from the profile</text>
  <rect x="352" y="562" width="336" height="64" rx="8" fill="#4a2512" stroke="#bd561d"/>
  <text x="520.0" y="581.0" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="700">compare()</text>
  <text x="520.0" y="599.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">one backtest per candidate, same cv,</text>
  <text x="520.0" y="614.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">scored with the metrics you choose</text>
  <rect x="724" y="562" width="280" height="64" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="864.0" y="581.0" text-anchor="middle" fill="#e6edf3" font-size="13.5" font-weight="700">A ranked answer</text>
  <text x="864.0" y="599.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">leaderboard with the code of every row;</text>
  <text x="864.0" y="614.0" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">the winner is ready to reuse</text>
  <path d="M320,594.0 H348" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M692,594.0 H720" stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="520" y="650" text-anchor="middle" fill="#9198a1" font-size="11.5" font-weight="400">The ranking is a plain sort of the metric column: deterministic and auditable. The LLM plays no part in choosing the winner.</text>
  <rect x="20" y="686" width="1000" height="100" rx="12" fill="#1c1530" stroke="#8957e5"/>
  <path d="M32,686 h976 a12,12 0 0 1 12,12 v28 h-1000 v-28 a12,12 0 0 1 12,-12 z" fill="#8957e5"/>
  <text x="36" y="711.0" text-anchor="start" fill="#ffffff" font-size="15" font-weight="700">LLM reasoning: available at any moment, in any workflow</text>
  <text x="36" y="750" text-anchor="start" fill="#e6edf3" font-size="12.5" font-weight="400">Call ask() before, during or after either path: it explains a profile (optionally with its plan), a script, a cross-validation strategy</text>
  <text x="36" y="767" text-anchor="start" fill="#e6edf3" font-size="12.5" font-weight="400">or any result, or answers a question with no context.</text>
</svg>
