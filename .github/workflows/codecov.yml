name: Codecov coverage

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: codecov-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests and collect coverage
        shell: bash  # with pipefail, so a failure of pytest is not hidden by tee
        env:
          KERAS_BACKEND: torch
          # NUMBA_DISABLE_JIT: 1  # Disable Numba JIT to capture a better coverage report
        run: |
          # -q keeps the log short so failures are easy to find; -ra lists them at the end;
          # verbosity_assertions=2 keeps the full assertion diffs of -vv. Failed tests are
          # also shown as annotations (pytest-github-actions-annotate-failures).
          # The log is kept to list the failures in the summary of the run.
          pytest -q -ra -o verbosity_assertions=2 --exclude-warning-annotations \
            --cov=skforecast_ai \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml \
            -o junit_family=legacy 2>&1 | tee pytest.log

      - name: List failed tests in the run summary
        if: ${{ failure() && hashFiles('pytest.log') != '' }}
        shell: bash
        run: |
          {
            echo "### Failed tests"
            echo '```'
            sed -n '/short test summary info/,$p' pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with: 
          token: ${{ secrets.CODECOV_GLOBAL_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_GLOBAL_TOKEN }}
          files: ./junit.xml
          report-type: test_results
          disable_search: true
          fail_ci_if_error: false
